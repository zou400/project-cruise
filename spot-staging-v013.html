<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot v0.13 Staging</title><style>body{margin:0;background:#0c0a0e;color:#eee;font:14px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:32px}.hero{padding:26px;border:1px solid #5b4030;border-radius:20px;background:linear-gradient(135deg,#191218,#2a1410)}h1{margin:0 0 8px;font-size:30px}.warn{color:#f0a45f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:18px}.card{padding:16px;border:1px solid #39323a;border-radius:14px;background:#151218}.tag{display:inline-block;margin:2px 4px 2px 0;padding:3px 7px;border-radius:999px;background:#2a2020;color:#f0a45f;font-size:11px}.bad{color:#ff8c8c}.good{color:#8ee6b0}code{color:#f0a45f}a{color:#f0a45f}</style></head><body><main><section class="hero"><h1>SPOT CHAT v0.13 — STAGING</h1><p>探索ラウンド1/3。22候補はまだ正本候補ではありません。Routes API、駐車寸法、合法アンカーの確認後に昇格します。</p><p class="warn">通常推薦へは混ぜません。既存RCは <code>?pcBreadth=off&pcNewDestinations=off</code> で完全復帰できます。</p></section><div id="summary"></div><div class="grid" id="grid"></div></main><script>Promise.all([fetch('data/staging/spot-chat-v0.13/new-destination-candidates-batch2.v0.13.json').then(r=>r.json()),fetch('data/staging/spot-chat-v0.13/wide-vehicle-compatibility-batch2.v0.13.json').then(r=>r.json()),fetch('data/staging/spot-chat-v0.13/staging-promotion-plan.v0.13.json').then(r=>r.json())]).then(([data,wide,promo])=>{const w=new Map(wide.items.map(x=>[x.candidateId,x]));document.querySelector('#summary').innerHTML=`<h2>${data.summary.newCandidates}候補 / 雨天適性4以上 ${data.summary.highRainCandidates}</h2>`;document.querySelector('#grid').innerHTML=data.candidates.map(c=>{const x=w.get(c.candidateId)||{};const hard=x.recommendedAction==='hard_exclude_for_user_vehicle';return `<article class="card"><small>${c.candidateId} / ${c.area}</small><h3>${c.name}</h3><span class="tag">${c.primaryCategory}</span>${c.secondaryCategories.map(v=>`<span class="tag">${v}</span>`).join('')}<p>${c.experience}</p><p class="${hard?'bad':x.status?.startsWith('compatible')?'good':''}">幅広車: ${x.status||c.wideVehicleStatus}</p><p>昇格: ${c.promotionLane}</p><small>${c.condition}</small></article>`}).join('')}).catch(e=>document.body.textContent=e);</script></body></html>
