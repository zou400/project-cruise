name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public boundary
        run: python tools/validate_public_repo.py --root . --report validation-report.json
      - name: Validate route integrity
        run: python tools/validate_route_integrity.py --root . --report route-integrity-report.json
      - name: Smoke test route integrity runtime
        env:
          TZ: Asia/Tokyo
        run: node tools/test_route_integrity_runtime.mjs
      - name: Stress test reroll hotfix runtime
        env:
          TZ: Asia/Tokyo
        run: node tools/test_reroll_hotfix_runtime.mjs
      - name: Test Cruise Decision UI runtime
        env:
          TZ: Asia/Tokyo
        run: node tools/test_cruise_decision_ui_runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pages-validation-report
          path: |
            validation-report.json
            route-integrity-report.json

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
