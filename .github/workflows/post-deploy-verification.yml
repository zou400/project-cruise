name: Post-Deploy Verification
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: GitHub Pages base URL
        required: true
        type: string
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deployed public runtime
        run: |
          python tools/post_deploy_verify_public.py \
            --base-url "${{ inputs.base_url }}" \
            --expected data/release-attestation.json \
            --output post-deploy-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-verification
          path: post-deploy-verification.json
