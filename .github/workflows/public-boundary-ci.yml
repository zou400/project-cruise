name: Public Boundary CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public repository
        run: python tools/validate_public_repo.py --root . --report validation-report.json
      - name: Validate route integrity
        run: python tools/validate_route_integrity.py --root . --report route-integrity-report.json
      - name: Smoke test route integrity runtime
        env:
          TZ: Asia/Tokyo
        run: node tools/test_route_integrity_runtime.mjs
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-boundary-validation
          path: |
            validation-report.json
            route-integrity-report.json
          if-no-files-found: error
